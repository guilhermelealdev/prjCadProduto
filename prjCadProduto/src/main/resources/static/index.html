<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro e Pesquisa de Produtos</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Cadastro e Pesquisa de Produtos</h1>

    <main>
        <div id="cadastro">

            <h2>Cadastro de Produtos</h2>

            <form id="cadastroForm">

                <label for="name">Nome:</label>
                <input type="text" id="name" name="name" required>
                <br>

                <label for="brand">Marca:</label>
                <input type="text" id="brand" name="brand" required>
                <br>

                <label for="price">Preço:</label>
                <input type="number" id="price" name="price" step="0.01" required>
                <br>

                <label for="category">Categoria:</label>
                <input type="text" id="category" name="category" required>
                <br>

                <label for="description">Descrição:</label>
                <input type="text" id="description" name="description" required>
                <br>

                <label for="category">Estoque:</label>
                <input type="number" id="stock" name="stock" required>
                <br>

                <label class="label-file">
                    Escolha uma imagem
                    <input type="file" id="thumbnail" name="thumbnail" accept=".jpg, .jpeg, .png" required>
                </label>

                <br><br>

                <button type="submit">Cadastrar</button>

            </form>

        </div>


        <div id="pesquisa">

            <h2>Pesquisa de Produto</h2>

            <form id="pesquisaForm">

                <label for="searchId">ID do Produto:</label>
                <input type="number" id="searchId" name="searchId">

                <br><br>

                <button type="button" onclick="pesquisarProduto()">Pesquisar</button>
                <button type="button" onclick="excluirProduto()">Excluir</button>
            </form>

            <div id="resultadoPesquisa"></div>

        </div>
    </main>


    <script src="script.js"></script>

</body>

</html>
